<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1be"/>
      <stop offset="30%" stop-color="#d4a574"/>
      <stop offset="70%" stop-color="#b6834b"/>
      <stop offset="100%" stop-color="#e8cfa1"/>
    </linearGradient>

    <!-- Burgundy Gradient -->
    <linearGradient id="burgundy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#72092c"/>
      <stop offset="60%" stop-color="#5d022a"/>
      <stop offset="100%" stop-color="#3d011b"/>
    </linearGradient>

    <!-- Needle Metallic Shine -->
    <linearGradient id="needleShine" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e5c898"/>
      <stop offset="70%" stop-color="#9a6e35"/>
      <stop offset="100%" stop-color="#fef4df"/>
    </linearGradient>

    <!-- Drop Shadow for Needle & Ribbon -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#5d022a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <g id="logo-emblem" transform="translate(30, 20)">
    <!-- Silk Thread Loop in Gold -->
    <path d="M 85,25 C 105,-5 125,45 80,75 C 50,95 20,80 35,45 C 45,20 85,50 65,95 C 55,115 15,110 5,85" 
          fill="none" stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Secondary Delicate Burgundy Thread Accent -->
    <path d="M 88,28 C 108,-2 128,48 83,78 C 53,98 23,83 38,48" 
          fill="none" stroke="url(#burgundy)" stroke-width="1.8" stroke-opacity="0.85" stroke-linecap="round"/>

    <!-- Slanted Tailoring Needle -->
    <path d="M 98,12 L 32,108 C 30,111 26,112 24,109 C 22,107 23,103 26,101 L 92,5 C 94,2 98,3 99,6 Z" 
          fill="url(#needleShine)" filter="url(#softGlow)"/>
    <!-- Needle Point -->
    <polygon points="24,109 20,116 27,112" fill="#b6834b"/>
    <!-- Needle Eyelet Hole -->
    <ellipse cx="94" cy="10" rx="2.2" ry="7" transform="rotate(-52 94 10)" fill="#fef0f0"/>
  </g>

  <!-- Typography: إبرة وخيط -->
  <g id="logo-text" transform="translate(160, 28)">
    <text x="320" y="65" text-anchor="end" 
          font-family="'Thmanyah Serif Display', 'DecoType Thuluth', 'Amiri', 'Traditional Arabic', serif" 
          font-size="64" font-weight="900" fill="url(#burgundy)" letter-spacing="1">
      إبرة وخيط
    </text>

    <!-- Subtitle: روب ووشاح تخرج عراقي -->
    <text x="318" y="96" text-anchor="end" 
          font-family="'Thmanyah Sans', 'Noto Sans Arabic', 'Segoe UI', sans-serif" 
          font-size="14" font-weight="600" fill="#b6834b" letter-spacing="4">
      أوشحة وأرواب التخرج الفاخرة
    </text>

    <!-- Small Golden Motif Diamond separator -->
    <path d="M 50,75 L 54,71 L 58,75 L 54,79 Z" fill="url(#gold)"/>
    <line x1="5" y1="75" x2="44" y2="75" stroke="url(#gold)" stroke-width="1.2" stroke-opacity="0.6"/>
  </g>
</svg>
